name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  root-package:
    name: Root package tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run the package container tests
        run: docker buildx build --target test -f Containerfile .

  prototype-history:
    name: Prototype history fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Give the prototype source a symbolic HEAD
        run: git switch --force-create ci-history-fixture HEAD
      - name: Run the prototype history fixture
        working-directory: proto
        run: >-
          docker buildx build --target git-history-test
          --build-context trusted_git=../.git
          -f .devcontainer/Dockerfile.devcontainer .

  distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build the wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
