name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  root-package:
    name: Root package tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run the package container tests
        run: docker buildx build --target test -f Containerfile .

  contract-matrix:
    name: Source, wheel, and OCI contract matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential ca-certificates gettext gnupg libcurl4-gnutls-dev libexpat1-dev libssl-dev python3-venv zlib1g-dev
      - name: Build the pinned Git toolchain
        run: |
          scripts/bootstrap-test-git.sh "$RUNNER_TEMP/git-2.47.0"
          echo "$RUNNER_TEMP/git-2.47.0/bin" >> "$GITHUB_PATH"
      - name: Run source-only helpers and verify the contract toolchain
        run: |
          python3 -m venv .venv-source
          .venv-source/bin/python -m pip install --no-deps -e . git-filter-repo==2.47.0
          PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH .venv-source/bin/python -m unittest -v tests.test_git_fixture tests.test_toolchain tests.test_policy
          PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH .venv-source/bin/python tests/support/toolchain.py
      - name: Run source contracts
        run: PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH GHS_TEST_RUNTIME=source tests/support/run_runtime_contracts.sh .venv-source/bin/python
      - name: Build distributions
        run: |
          python3 -m pip install build==1.3.0
          python3 -m build
      - name: Run wheel contracts
        run: PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH GHS_TEST_RUNTIME=wheel GHS_WHEEL="$(realpath dist/*.whl)" tests/support/run_runtime_contracts.sh .venv-source/bin/python
      - name: Build and validate OCI runtime
        run: |
          docker buildx build --load -t git-history-sanitize:local -f Containerfile .
          docker run --rm --entrypoint python3 -v "$PWD/tests/support/toolchain.py:/toolchain.py:ro" git-history-sanitize:local /toolchain.py
      - name: Run OCI contracts
        run: PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH GHS_TEST_RUNTIME=container GHS_CONTAINER_IMAGE=git-history-sanitize:local tests/support/run_runtime_contracts.sh .venv-source/bin/python
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-matrix-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  prototype-history:
    name: Prototype history fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Build a linear trusted history fixture
        run: |
          fixture="$RUNNER_TEMP/trusted-git"
          git init --initial-branch=main "$fixture"
          git -C "$fixture" fetch --no-tags "$GITHUB_WORKSPACE/.git" "$GITHUB_SHA"
          source_tree="$(git -C "$fixture" rev-parse FETCH_HEAD^{tree})"
          old_blob="$(printf 'pre-cutoff fixture secret\n' | git -C "$fixture" hash-object -w --stdin)"
          old_tree="$(printf '100644 blob %s\tsecret.json\n' "$old_blob" | git -C "$fixture" mktree)"
          old_commit="$(printf 'pre-cutoff fixture\n' | GIT_AUTHOR_NAME=CI GIT_AUTHOR_EMAIL=ci@example.invalid GIT_AUTHOR_DATE=2026-09-02T12:00:00+00:00 GIT_COMMITTER_NAME=CI GIT_COMMITTER_EMAIL=ci@example.invalid GIT_COMMITTER_DATE=2026-09-02T12:00:00+00:00 git -C "$fixture" commit-tree "$old_tree")"
          retained_commit="$(printf 'retained fixture\n' | GIT_AUTHOR_NAME=CI GIT_AUTHOR_EMAIL=ci@example.invalid GIT_AUTHOR_DATE=2026-09-03T12:00:00+00:00 GIT_COMMITTER_NAME=CI GIT_COMMITTER_EMAIL=ci@example.invalid GIT_COMMITTER_DATE=2026-09-03T12:00:00+00:00 git -C "$fixture" commit-tree "$source_tree" -p "$old_commit")"
          git -C "$fixture" update-ref refs/heads/main "$retained_commit"
      - name: Run the prototype history fixture
        working-directory: proto
        run: >-
          docker buildx build --target git-history-test
          --build-context trusted_git="$RUNNER_TEMP/trusted-git/.git"
          -f .devcontainer/Dockerfile.devcontainer .

  distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build the wheel and source distribution
        run: |
          python -m pip install --upgrade pip build==1.3.0
          python -m build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
