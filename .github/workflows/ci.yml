name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  root-package:
    name: Root package tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run the package container tests
        run: docker buildx build --target test -f Containerfile .

  contract-matrix:
    name: Source, wheel, and OCI contract matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential ca-certificates gettext gnupg libcurl4-gnutls-dev libexpat1-dev libssl-dev python3-venv zlib1g-dev
      - name: Build the pinned Git toolchain
        run: |
          scripts/bootstrap-test-git.sh "$RUNNER_TEMP/git-2.47.0"
          echo "$RUNNER_TEMP/git-2.47.0/bin" >> "$GITHUB_PATH"
      - name: Run source-only helpers and verify the contract toolchain
        run: |
          python3 -m venv .venv-source
          .venv-source/bin/python -m pip install --requirement requirements/release-test.txt
          .venv-source/bin/python -m pip install --no-deps git-filter-repo==2.47.0
          .venv-source/bin/python -m pip install --no-deps -e .
          PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH .venv-source/bin/python -m unittest -v tests.test_engine_failure_contracts tests.test_git_fixture tests.test_toolchain tests.test_policy tests.test_publication tests.test_receipt tests.test_release_versioning tests.test_release_workflow
          PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH .venv-source/bin/python tests/support/toolchain.py
      - name: Run source contracts
        run: PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH GHS_TEST_RUNTIME=source tests/support/run_runtime_contracts.sh .venv-source/bin/python
      - name: Build distributions
        run: |
          python3 -m pip install --requirement requirements/release-test.txt
          version="$(python3 -c 'from pathlib import Path; import ast; print(next(node.value.value for node in ast.parse(Path("src/git_history_sanitize/_version.py").read_text()).body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)))')"
          python3 scripts/release.py check --version "$version" --output dist
      - name: Run wheel contracts
        run: PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH GHS_TEST_RUNTIME=wheel GHS_WHEEL="$(realpath dist/distributions/*.whl)" tests/support/run_runtime_contracts.sh .venv-source/bin/python
      - name: Build and validate OCI runtime
        run: |
          docker buildx build --load -t git-history-sanitize:local -f Containerfile .
          docker run --rm --entrypoint python3 -v "$PWD/tests/support/toolchain.py:/toolchain.py:ro" git-history-sanitize:local /toolchain.py
      - name: Run OCI contracts
        run: PATH="$PWD/.venv-source/bin:$PATH" env -u PYTHONPATH GHS_TEST_RUNTIME=container GHS_CONTAINER_IMAGE=git-history-sanitize:local tests/support/run_runtime_contracts.sh .venv-source/bin/python
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-matrix-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  oci-inputs:
    name: Select OCI-sensitive inputs
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: select
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.event.after }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" = "schedule" ]] || \
            [[ "$GITHUB_EVENT_NAME" = "push" && "$GITHUB_REF_NAME" = "main" ]]; then
            selection=true
          elif [[ "$GITHUB_EVENT_NAME" = "pull_request" ]]; then
            selection="$(scripts/ci-detect-oci-inputs.sh "$PR_BASE" "$PR_HEAD")"
          else
            selection="$(scripts/ci-detect-oci-inputs.sh "$PUSH_BASE" "$PUSH_HEAD")"
          fi
          printf 'selected=%s\n' "$selection" >> "$GITHUB_OUTPUT"

  oci-arm64-contract:
    name: Native arm64 OCI contract
    needs: oci-inputs
    if: needs.oci-inputs.outputs.selected == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Assert native arm64 runner
        run: test "$(uname -m)" = "aarch64"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the arm64 image
        env:
          OCI_TEST_IMAGE: git-history-sanitize:ci-arm64
        run: |
          cache_args=()
          if [[ "$GITHUB_EVENT_NAME" = "pull_request" ]]; then
            cache_args=(
              --cache-from type=gha,scope=oci-linux-arm64
              --cache-to type=gha,mode=max,scope=oci-linux-arm64
            )
          fi
          docker buildx build --platform linux/arm64 --load "${cache_args[@]}" \
            --tag "$OCI_TEST_IMAGE" -f Containerfile .
      - name: Validate the configured image entrypoint
        env:
          OCI_TEST_IMAGE: git-history-sanitize:ci-arm64
        run: docker run --rm --platform linux/arm64 "${OCI_TEST_IMAGE}" doctor
      - name: Validate runtime identity and caller-owned output mode
        env:
          OCI_TEST_IMAGE: git-history-sanitize:ci-arm64
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "${OCI_TEST_IMAGE}")" = "65532:65532"
          docker run --rm --platform linux/arm64 --user "$(id -u):$(id -g)" "${OCI_TEST_IMAGE}" doctor --json
      - name: Run platform-specific rewrite and ownership contracts
        env:
          GHS_CONTAINER_IMAGE: git-history-sanitize:ci-arm64
          GHS_OCI_RUNTIME: docker
          GHS_OCI_PLATFORM: linux/arm64
          GHS_TEST_RUNTIME: container
        run: |
          python3 -m venv .venv-oci-contracts
          .venv-oci-contracts/bin/python -m pip install --requirement requirements/release-test.txt
          .venv-oci-contracts/bin/python -m pip install --no-deps -e .
          .venv-oci-contracts/bin/python -m unittest -v \
            tests.test_output_cleanup_contracts.OutputContractTests.test_output_is_bare_and_has_no_cleanup_artifacts

  oci-arm64-validation:
    name: OCI arm64 validation
    needs: [oci-inputs, oci-arm64-contract]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report the selected validation outcome
        env:
          SELECTOR_RESULT: ${{ needs.oci-inputs.result }}
          SELECTED: ${{ needs.oci-inputs.outputs.selected }}
          CONTRACT_RESULT: ${{ needs.oci-arm64-contract.result }}
        run: |
          if [[ "$SELECTOR_RESULT" != "success" ]]; then
            echo "OCI input selection failed; selected validation is required."
            exit 1
          fi
          if [[ "$SELECTED" = "true" && "$CONTRACT_RESULT" != "success" ]]; then
            echo "Selected arm64 validation did not succeed: $CONTRACT_RESULT"
            exit 1
          fi
          if [[ "$SELECTED" = "false" ]]; then
            echo "OCI inputs are unchanged; arm64 validation was intentionally skipped."
          else
            echo "Selected arm64 validation succeeded."
          fi

  prototype-history:
    name: Prototype history fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Build a linear trusted history fixture
        run: |
          fixture="$RUNNER_TEMP/trusted-git"
          git init --initial-branch=main "$fixture"
          git -C "$fixture" fetch --no-tags "$GITHUB_WORKSPACE/.git" "$GITHUB_SHA"
          source_tree="$(git -C "$fixture" rev-parse FETCH_HEAD^{tree})"
          old_blob="$(printf 'pre-cutoff fixture secret\n' | git -C "$fixture" hash-object -w --stdin)"
          old_tree="$(printf '100644 blob %s\tsecret.json\n' "$old_blob" | git -C "$fixture" mktree)"
          old_commit="$(printf 'pre-cutoff fixture\n' | GIT_AUTHOR_NAME=CI GIT_AUTHOR_EMAIL=ci@example.invalid GIT_AUTHOR_DATE=2026-09-02T12:00:00+00:00 GIT_COMMITTER_NAME=CI GIT_COMMITTER_EMAIL=ci@example.invalid GIT_COMMITTER_DATE=2026-09-02T12:00:00+00:00 git -C "$fixture" commit-tree "$old_tree")"
          retained_commit="$(printf 'retained fixture\n' | GIT_AUTHOR_NAME=CI GIT_AUTHOR_EMAIL=ci@example.invalid GIT_AUTHOR_DATE=2026-09-03T12:00:00+00:00 GIT_COMMITTER_NAME=CI GIT_COMMITTER_EMAIL=ci@example.invalid GIT_COMMITTER_DATE=2026-09-03T12:00:00+00:00 git -C "$fixture" commit-tree "$source_tree" -p "$old_commit")"
          git -C "$fixture" update-ref refs/heads/main "$retained_commit"
      - name: Run the prototype history fixture
        working-directory: proto
        run: >-
          docker buildx build --target git-history-test
          --build-context trusted_git="$RUNNER_TEMP/trusted-git/.git"
          -f .devcontainer/Dockerfile.devcontainer .

  distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build the wheel and source distribution
        run: |
          python -m pip install --upgrade pip build==1.3.0
          python -m build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
