name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to rehearse
        required: true
        default: main
        type: string
      version:
        description: Intended stable package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  root-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - run: docker buildx build --target test -f Containerfile .

  prototype-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - run: git switch --force-create ci-history-fixture HEAD
      - working-directory: proto
        run: docker buildx build --target git-history-test --build-context trusted_git=../.git -f .devcontainer/Dockerfile.devcontainer .

  release-gate:
    needs: [root-package, prototype-history]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install --requirement requirements/release-test.txt
      - env:
          VERSION: ${{ inputs.version }}
        run: python scripts/release.py check --version "$VERSION" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/git-history-sanitize
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/distributions/
          repository-url: https://test.pypi.org/legacy/
