name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/f4irline/git-history-sanitize

jobs:
  root-package:
    name: Root package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker buildx build --target test -f Containerfile .

  prototype-history:
    name: Prototype history fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: git switch --force-create ci-history-fixture HEAD
      - working-directory: proto
        run: docker buildx build --target git-history-test --build-context trusted_git=../.git -f .devcontainer/Dockerfile.devcontainer .

  release-gate:
    name: Validate version and artifacts
    needs: [root-package, prototype-history]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install --requirement requirements/release-test.txt
      - id: gate
        run: |
          python scripts/release.py check --tag "$GITHUB_REF_NAME" --output dist
          version="$(python -c 'import json; print(json.load(open("dist/version-manifest.json"))["version"])')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/git-history-sanitize
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release-assets/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-assets/distributions/

  build-amd64-image:
    name: Build OCI amd64 image
    needs: release-gate
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: source
        run: printf 'date_epoch=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA^{commit}")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.date_epoch }}
            SOURCE_REVISION=${{ github.sha }}
            PACKAGE_VERSION=${{ needs.release-gate.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

  validate-arm64-image:
    name: Validate OCI arm64 image
    needs: release-gate
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Assert native arm64 runner
        run: test "$(uname -m)" = "aarch64"
      - id: source
        run: printf 'date_epoch=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA^{commit}")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.date_epoch }}
            SOURCE_REVISION=${{ github.sha }}
            PACKAGE_VERSION=${{ needs.release-gate.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Validate the pushed arm64 image
        env:
          OCI_TEST_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          docker pull --platform linux/arm64 "$OCI_TEST_IMAGE"
          docker run --rm --platform linux/arm64 "$OCI_TEST_IMAGE" doctor
          test "$(docker image inspect --format '{{.Config.User}}' "$OCI_TEST_IMAGE")" = "65532:65532"
          docker run --rm --platform linux/arm64 --user "$(id -u):$(id -g)" "$OCI_TEST_IMAGE" doctor --json
      - name: Run platform-specific rewrite and ownership contracts
        env:
          GHS_CONTAINER_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          GHS_OCI_RUNTIME: docker
          GHS_OCI_PLATFORM: linux/arm64
          GHS_TEST_RUNTIME: container
        run: |
          python3 -m venv .venv-oci-contracts
          .venv-oci-contracts/bin/python -m pip install --requirement requirements/release-test.txt
          .venv-oci-contracts/bin/python -m pip install --no-deps -e .
          .venv-oci-contracts/bin/python -m unittest -v \
            tests.test_output_cleanup_contracts.OutputContractTests.test_output_is_bare_and_has_no_cleanup_artifacts

  publish-image:
    name: Publish OCI image
    needs: [release-gate, build-amd64-image, validate-arm64-image]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ needs.release-gate.outputs.version }}
            type=raw,value=${{ needs.release-gate.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.release-gate.outputs.version }}
      - id: push
        env:
          AMD64_DIGEST: ${{ needs.build-amd64-image.outputs.digest }}
          ARM64_DIGEST: ${{ needs.validate-arm64-image.outputs.digest }}
        run: |
          staging_tag="validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$IMAGE_NAME:$staging_tag" \
            "$IMAGE_NAME@$AMD64_DIGEST" "$IMAGE_NAME@$ARM64_DIGEST"
          digest="sha256:$(docker buildx imagetools inspect "$IMAGE_NAME:$staging_tag" --raw | sha256sum | cut -d ' ' -f 1)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Validate Trivy exceptions
        run: python3 scripts/validate-trivy-exceptions.py security/trivyignore.yaml
      - name: Scan the pushed image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: security/trivyignore.yaml
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Promote the scanned image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "$tag" "$IMAGE_NAME@$DIGEST"
          done <<< "$TAGS"

  github-release:
    name: Create GitHub Release
    needs: [release-gate, publish-pypi, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release-assets/
      - env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          sed "s/{{VERSION}}/${VERSION}/g; s/{{IMAGE_DIGEST}}/${IMAGE_DIGEST}/g" docs/release-notes.md > release-notes.md
          gh release create "v${VERSION}" release-assets/distributions/* release-assets/SHA256SUMS release-assets/version-manifest.json \
            --title "Git History Sanitize ${VERSION}" --notes-file release-notes.md --generate-notes
