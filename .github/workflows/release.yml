name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/f4irline/git-history-sanitize

jobs:
  root-package:
    name: Root package tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run the package container tests
        run: docker buildx build --target test -f Containerfile .

  prototype-history:
    name: Prototype history fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Give the prototype source a symbolic HEAD
        run: git switch --force-create ci-history-fixture HEAD
      - name: Run the prototype history fixture
        working-directory: proto
        run: >-
          docker buildx build --target git-history-test
          --build-context trusted_git=../.git
          -f .devcontainer/Dockerfile.devcontainer .

  distributions:
    name: Build Python distributions
    needs: [root-package, prototype-history]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build the wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
          sha256sum dist/* > SHA256SUMS
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/git-history-sanitize
    permissions:
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release-assets/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-assets/dist/

  publish-image:
    name: Publish OCI image
    needs: publish-pypi
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Derive image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Create GitHub Release
    needs: [publish-pypi, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release-assets/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## Install

          \`\`\`bash
          pipx install git-history-sanitize==${version}
          \`\`\`

          ## OCI image

          \`\`\`text
          ${IMAGE_NAME}@${IMAGE_DIGEST}
          \`\`\`

          Requires Python 3.11 or later, Git 2.36 or later, and
          \`git-filter-repo\` for the PyPI installation. The OCI image bundles
          those runtime dependencies.

          ## Changes

          EOF
          gh release create "${GITHUB_REF_NAME}" release-assets/dist/* release-assets/SHA256SUMS \
            --title "Git History Sanitize ${version}" \
            --notes-file release-notes.md \
            --generate-notes
