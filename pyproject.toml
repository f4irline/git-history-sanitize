[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-history-sanitize"
version = "0.1.0"
description = "Create independently verifiable sanitized Git histories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "f4irline"}]
maintainers = [{name = "f4irline"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
git-history-sanitize = "git_history_sanitize.cli:main"

[project.urls]
Homepage = "https://github.com/f4irline/git-history-sanitize"
Repository = "https://github.com/f4irline/git-history-sanitize"
Issues = "https://github.com/f4irline/git-history-sanitize/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
